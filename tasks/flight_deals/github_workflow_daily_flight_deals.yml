name: Daily Flight Deals (15 Routes)

on:
  schedule:
    # 04:00 UTC = 13:00 JST every day
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      routes:
        description: "Optional comma-separated routes (leave empty for all 15)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-flight-deals
  cancel-in-progress: false

jobs:
  verify-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code (main)
        uses: actions/checkout@v4

      - name: Restore accumulated snapshots from flight-deals-data branch (if present)
        run: |
          mkdir -p /tmp/dashboard_site/snapshots /tmp/dashboard_site/reports
          if git ls-remote --exit-code --heads origin flight-deals-data >/dev/null 2>&1; then
            git fetch origin flight-deals-data:refs/remotes/origin/flight-deals-data
            git worktree add /tmp/prev_data origin/flight-deals-data
            cp -rn /tmp/prev_data/snapshots/. /tmp/dashboard_site/snapshots/ 2>/dev/null || true
            cp -rn /tmp/prev_data/reports/. /tmp/dashboard_site/reports/ 2>/dev/null || true
            git worktree remove --force /tmp/prev_data
          fi

      - name: Install uv & Python environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies & Playwright Chromium
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python \
            duckdb polars pyarrow pydantic httpx selectolax beautifulsoup4 playwright tenacity
          .venv/bin/playwright install --with-deps chromium

      - name: Run unit tests
        run: |
          .venv/bin/python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify live search result screens across 15 routes
        env:
          TZ: Asia/Tokyo
          ROUTES_FILTER: ${{ inputs.routes }}
        run: |
          RUN_DATE="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          EXTRA_ARGS=()
          if [ -n "${ROUTES_FILTER}" ]; then
            EXTRA_ARGS+=(--routes "${ROUTES_FILTER}")
          fi
          .venv/bin/python tasks/flight_deals/run.py \
            --run-dir "/tmp/run_${RUN_DATE}" \
            --out "/tmp/dashboard_site/reports/${RUN_DATE}.md" \
            --json-out "/tmp/dashboard_site/snapshots/${RUN_DATE}.json" \
            "${EXTRA_ARGS[@]}"
          cp "/tmp/dashboard_site/reports/${RUN_DATE}.md" "/tmp/dashboard_site/reports/latest.md"

      - name: Build cumulative interactive HTML dashboard
        run: |
          .venv/bin/python tasks/flight_deals/dashboard.py \
            --snapshots-dir /tmp/dashboard_site/snapshots \
            --out /tmp/dashboard_site/index.html \
            --mode standalone
          touch /tmp/dashboard_site/.nojekyll

      - name: Publish report to GitHub Actions Job Summary
        run: |
          cat /tmp/dashboard_site/reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report & dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-deals-dashboard
          path: /tmp/dashboard_site/
          retention-days: 30

      - name: Publish updated dashboard & history to flight-deals-data branch
        run: |
          WORK_PUB="/tmp/publish_branch"
          mkdir -p "${WORK_PUB}"
          cp -r /tmp/dashboard_site/. "${WORK_PUB}/"
          cd "${WORK_PUB}"
          git init -b flight-deals-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          RUN_TS="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          git commit -m "chore(flight-deals): update daily snapshot (${RUN_TS})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" flight-deals-data:flight-deals-data
